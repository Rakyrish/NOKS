name: NOKS CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Django
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noks
          POSTGRES_USER: noks
          POSTGRES_PASSWORD: noks
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://noks:noks@localhost:5432/noks
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: System checks
        working-directory: backend
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are complete
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: backend
        run: python manage.py test --verbosity 2

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
