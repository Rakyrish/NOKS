upstream noks_backend { server backend:8000; }
upstream noks_frontend { server frontend:3000; }

# Core Web Vitals: aggressive compression + long-lived immutable assets.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/rss+xml image/svg+xml font/woff font/woff2;

proxy_http_version 1.1;

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Security headers (Lighthouse "Best Practices")
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    location /api/   { proxy_pass http://noks_backend; }
    location /admin/ { proxy_pass http://noks_backend; }

    location /django-static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://noks_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / { proxy_pass http://noks_frontend; }
}
