resolver 127.0.0.11 valid=10s ipv6=off;
upstream noks_backend { zone noks_backend 64k; server backend:8000 resolve; }
upstream noks_frontend { zone noks_frontend 64k; server frontend:3000 resolve; }

# This nginx sits BEHIND the edge nginx that terminates TLS, so its own $scheme
# is always "http". Forwarding that verbatim would tell Django the request was
# insecure, and SECURE_SSL_REDIRECT would bounce it to https:// — which comes
# straight back here as http, looping forever (ERR_TOO_MANY_REDIRECTS on every
# page). Honour the scheme the edge already determined, and fall back to our own
# only when the header is absent (e.g. hitting this container directly).
map $http_x_forwarded_proto $noks_forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

# Likewise for the client IP chain: keep whatever the edge collected and append.
map $http_x_forwarded_for $noks_forwarded_for {
    default $remote_addr;
    "~."    "$http_x_forwarded_for, $remote_addr";
}

# A hardcoded `Connection: upgrade` is sent on every request, including plain
# GETs that never asked to upgrade — a protocol violation that also defeats
# keepalive to the upstreams. Drive it from the client's actual Upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Core Web Vitals: aggressive compression + long-lived immutable assets.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/rss+xml image/svg+xml font/woff font/woff2;

proxy_http_version 1.1;

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Security headers (Lighthouse "Best Practices")
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $noks_forwarded_for;
    proxy_set_header X-Forwarded-Proto $noks_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location = /api/revalidate { proxy_pass http://noks_frontend; }
    location /api/          { proxy_pass http://noks_backend; }
    # Django's own admin — deliberately NOT at /admin/, which is now the
    # Next.js control panel (falls through to `location /` below). Must stay
    # in sync with DJANGO_ADMIN_URL in .env.
    location /django-admin/ { proxy_pass http://noks_backend; }

    location /django-static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://noks_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Until the D1 fix shipped, Product and Article JSON-LD published images as
    # "https://chemicals.noksindustrial.com/https://res.cloudinary.com/...".
    # Google recorded those as URLs on this host and still requests them: Next
    # answered 308 (collapsing the double slash) into a 404, which is most of
    # Search Console's "Page with redirect" and "Not found (404)" rows. The
    # asset behind each one is real, so send it there in one hop. merge_slashes
    # (on by default) has already folded "https://" to "https:/" here.
    location ~ ^/https?:/+res\.cloudinary\.com/(.*)$ {
        return 301 https://res.cloudinary.com/$1;
    }

    location / { proxy_pass http://noks_frontend; }
}
