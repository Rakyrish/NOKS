name: noks-chemical

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 90"
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A config worker -l info

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - redis
      - db
    command: celery -A config beat -l info

  frontend:
    build:
      # Repo root, so the builder stage can copy the single root-level .env that
      # next.config.ts reads to inline every NEXT_PUBLIC_* value. See
      # frontend/Dockerfile for the full reasoning.
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Deliberately publishes NO host port. Ports 80/443 on this machine belong
    # to the kivi stack's nginx, which is the single TLS terminator for the box.
    # That edge nginx reaches this one by name over the shared `edge` network
    # (alias noks-web) and proxies chemicals.noksindustrial.com here. Everything
    # below this point — routing, static, media, upstreams — stays NOKS's own.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
      - staticfiles:/var/www/static:ro
    networks:
      default:
      edge:
        aliases:
          - noks-web
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles:

networks:
  # Private to this stack: db, redis, backend, worker, beat, frontend, nginx.
  default:
  # Shared reverse-proxy network, created once outside compose:
  #   docker network create edge
  # Only the nginx containers of each stack join it, so the two sites stay
  # fully isolated from each other's database, cache and application services.
  edge:
    external: true
